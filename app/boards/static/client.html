<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>LaneHub Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Read-only client board: summary ledger on top, five status columns that stack on phones. */
:root {
  --bg: #f4f2f5; --surface: #ffffff; --surface-2: #ece8ee; --fg: #221d26; --muted: #6c6472; --line: #ddd6e0;
  --accent: #b5135f; --accent-soft: #f6dce8;
  --ok: #1f7a46; --ok-soft: #dcefe3; --warn: #8a5a00; --warn-soft: #f6ead0; --info: #3b4fa3; --info-soft: #e1e5f5;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 8px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #17141a; --surface: #221e26; --surface-2: #2c2731; --fg: #eee9f1; --muted: #a59cab; --line: #3a3340;
  --accent: #f0619f; --accent-soft: #4a2236;
  --ok: #6fcf97; --ok-soft: #1f3a2a; --warn: #e6b45a; --warn-soft: #3f321a; --info: #9aa9ee; --info-soft: #262d4d;
  color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { padding-inline: 16px; padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); max-width: 1500px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.brand { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; margin: 0 0 4px; }
h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.lang-switch { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; }
.lang-btn { background: transparent; border: none; border-radius: calc(var(--radius) - 2px); padding: 4px 9px; font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .1s ease; }
.lang-btn:hover { color: var(--fg); background: var(--surface-2); }
.lang-btn.active { background: var(--accent); color: #ffffff; font-weight: 600; }
.ledger { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.ledger .cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; }
.ledger .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ledger .v { font-family: var(--font-mono); font-size: 16px; font-weight: 500; }
.ledger .cell.rest .v { color: var(--ok); }
.info { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; color: var(--muted); display: grid; gap: 4px; }
.info strong { color: var(--fg); font-weight: 500; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; min-width: 0; }
.col > summary { list-style: none; cursor: default; }
.col > summary::-webkit-details-marker { display: none; }
.col > summary .chev { display: none; }
@media (max-width: 759px) {
  .header-right { align-items: stretch; width: 100%; }
  .lang-switch { align-self: flex-start; }
  .col > summary { cursor: pointer; padding: 4px 2px; -webkit-tap-highlight-color: transparent; }
  .col > summary .chev { display: inline-block; transition: transform .15s; color: var(--muted); }
  .col[open] > summary .chev { transform: rotate(90deg); }
  .col:not([open]) { padding-block: 8px; }
}
.col > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.col .body { display: grid; gap: 8px; }
.col h2 { font-size: 13px; font-weight: 600; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-transform: uppercase; letter-spacing: .05em; }
.col h2 .name { display: inline-flex; align-items: baseline; gap: 6px; }
.col h2 .meta { font-family: var(--font-mono); font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 12px; }
.col .hint { font-size: 12px; color: var(--muted); margin: -2px 0 2px; }
.col .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; display: grid; gap: 6px; min-width: 0; }
.card .title { font-weight: 500; overflow-wrap: anywhere; }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.card .note { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.chip { border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip.deposit { background: var(--accent-soft); color: var(--accent); }
.chip.free { background: var(--ok-soft); color: var(--ok); }
.chip.paid { background: var(--info-soft); color: var(--info); }
.chip.estimate { background: var(--warn-soft); color: var(--warn); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.status-card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }
.status-hd { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.status-lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--accent); }
.status-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status-text { font-size: 14.5px; font-weight: 500; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.waiting-banner { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.waiting-banner-hd { font-size: 13.5px; font-weight: 600; color: var(--fg); }
.waiting-banner-list { display: grid; gap: 8px; }
.waiting-card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 4px; }
.waiting-card .w-title { font-weight: 500; overflow-wrap: anywhere; }
.waiting-card .w-note { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.badge-new { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: #ffffff; vertical-align: middle; margin-left: 6px; }
.archive-section { display: grid; gap: 8px; }
.archive-section h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin: 0; color: var(--muted); }
.archive-months { display: grid; gap: 8px; }
.archive-month { background: var(--surface-2); border-radius: var(--radius); padding: 10px; }
.archive-month > summary { list-style: none; cursor: pointer; padding: 4px 2px; -webkit-tap-highlight-color: transparent; }
.archive-month > summary::-webkit-details-marker { display: none; }
.archive-month > summary .chev { display: inline-block; transition: transform .15s; color: var(--muted); margin-right: 6px; }
.archive-month[open] > summary .chev { transform: rotate(90deg); }
.archive-month-title { font-size: 13.5px; font-weight: 600; }
.archive-items { margin-top: 8px; display: grid; gap: 6px; }
.archive-item { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.client-done-box { margin-top: 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; box-sizing: border-box; }
.btn-client-done { display: inline-flex; align-items: center; gap: 5px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-family: var(--font-body); font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all .1s ease; width: fit-content; -webkit-tap-highlight-color: transparent; }
.btn-client-done:hover:not(:disabled) { border-color: var(--ok); color: var(--ok); }
.btn-client-done:disabled { opacity: 0.5; cursor: not-allowed; }
.client-done-status { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--ok); font-weight: 500; }
.client-done-cancel, .client-done-link, .client-done-comment-cancel { background: transparent; border: none; padding: 0; font-family: var(--font-body); font-size: 11.5px; color: var(--muted); text-decoration: underline; cursor: pointer; }
.client-done-cancel:hover:not(:disabled), .client-done-link:hover:not(:disabled), .client-done-comment-cancel:hover:not(:disabled) { color: var(--fg); }
.client-done-cancel:disabled, .client-done-link:disabled, .client-done-comment-cancel:disabled { opacity: 0.5; cursor: not-allowed; }
.client-done-save-btn { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 3px 9px; font-family: var(--font-body); font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all .1s ease; }
.client-done-save-btn:hover:not(:disabled) { border-color: var(--ok); color: var(--ok); }
.client-done-save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.client-done-textarea { width: 100%; max-width: 100%; box-sizing: border-box; resize: vertical; min-height: 42px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-family: var(--font-body); font-size: 12px; background: var(--surface); color: var(--fg); }
.client-done-textarea:focus { outline: none; border-color: var(--accent); }
.client-done-textarea:disabled { opacity: 0.6; cursor: not-allowed; }
.client-done-hint { font-size: 11px; color: var(--muted); line-height: 1.35; }
.client-done-comment { font-size: 12px; color: var(--muted); font-style: italic; margin: 2px 0; word-break: break-word; white-space: pre-wrap; }
.client-done-actions { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
footer { color: var(--muted); font-size: 12.5px; display: grid; gap: 4px; }
.err { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="brand" id="brand"></p>
      <h1 id="board-title"></h1>
      <p class="sub" id="updated">...</p>
    </div>
    <div class="header-right">
      <nav class="lang-switch" aria-label="Language" id="lang-switch"></nav>
      <div class="ledger" id="ledger-box" aria-label="Ledger">
        <div class="cell"><span class="k" id="lbl-paid">Paid</span><span class="v" id="lg-paid">—</span></div>
        <div class="cell"><span class="k" id="lbl-dep">Deposit</span><span class="v" id="lg-dep">—</span></div>
        <div class="cell"><span class="k" id="lbl-used">Allocated</span><span class="v" id="lg-used">—</span></div>
        <div class="cell rest"><span class="k" id="lbl-rest">Remaining</span><span class="v" id="lg-rest">—</span></div>
      </div>
    </div>
  </header>

  <div class="status-card" id="status-card" hidden>
    <div class="status-hd">
      <span class="status-lbl" id="lbl-status"></span>
      <span class="status-time" id="status-time"></span>
    </div>
    <div class="status-text" id="status-text"></div>
  </div>

  <div class="waiting-banner" id="waiting-banner" hidden>
    <div class="waiting-banner-hd">
      <strong id="waiting-banner-title"></strong>
    </div>
    <div class="waiting-banner-list" id="waiting-banner-list"></div>
  </div>

  <div class="info">
    <span><strong id="info-title"></strong> <span id="info-backlog"></span></span>
    <span id="info-waiting"></span>
  </div>

  <main class="board" id="board"></main>

  <section class="archive-section" id="archive-section" hidden>
    <h2 id="lbl-archive-title"></h2>
    <div class="archive-months" id="archive-months"></div>
  </section>

  <footer>
    <span><strong id="footer-q-title"></strong> <span id="footer-q-text"></span></span>
    <span id="footer-notice"></span>
  </footer>
</div>
<script>
(() => {
  const COLS = [
    { id: "backlog", titleKey: "col_backlog", hintKey: "col_backlog_hint" },
    { id: "queue", titleKey: "col_queue", hintKey: "col_queue_hint" },
    { id: "doing", titleKey: "col_doing", hintKey: "col_doing_hint" },
    // "waiting" has no column here: those cards are shown once, in the «Потрібно від вас» banner.
    { id: "done", titleKey: "col_done", hintKey: "col_done_hint" },
  ];
  const $ = (id) => document.getElementById(id);
  const mobile = window.matchMedia("(max-width: 759px)");
  const DEFAULT_OPEN = { backlog: false, queue: true, doing: true, done: false };
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("yl-client-cols") || "{}"); } catch (e) {}
  const isOpen = (id, count) => !mobile.matches || (id in saved ? saved[id] : DEFAULT_OPEN[id] && count > 0);
  const remember = (id, open) => { saved[id] = open; try { localStorage.setItem("yl-client-cols", JSON.stringify(saved)); } catch (e) {} };
  
  const visitKey = "lh-board-visit-" + window.location.pathname;
  let prevVisit = null;
  try {
    const stored = localStorage.getItem(visitKey);
    if (stored) prevVisit = parseInt(stored, 10);
    localStorage.setItem(visitKey, String(Math.floor(Date.now() / 1000)));
  } catch (e) {}

  let lastLang = null, lastData = null;
  mobile.addEventListener("change", () => { if (lastData) render(lastData, lastLang); });

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  function fmtMoney(n, lang, currency) {
    const num = Math.round((Number(n) || 0) * 100) / 100;
    try {
      const loc = lang === "uk" ? "uk-UA" : (lang === "pl" ? "pl-PL" : (lang === "ru" ? "ru-RU" : "en-US"));
      const formatted = new Intl.NumberFormat(loc, { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(num);
      return currency ? formatted + " " + currency : formatted;
    } catch (e) {
      return num + (currency ? " " + currency : "");
    }
  }

  function fmtMonth(monthStr, lang) {
    const parts = monthStr.split("-");
    if (parts.length !== 2) return monthStr;
    const year = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10);
    const d = new Date(Date.UTC(year, month - 1, 1));
    const loc = lang === "uk" ? "uk-UA" : (lang === "pl" ? "pl-PL" : (lang === "ru" ? "ru-RU" : "en-US"));
    try {
      const s = new Intl.DateTimeFormat(loc, { month: "long", year: "numeric", timeZone: "UTC" }).format(d);
      return s.charAt(0).toUpperCase() + s.slice(1);
    } catch (e) {
      return monthStr;
    }
  }

  function priceChip(c, ui, lang, currency) {
    const p = Number(c.price) || 0;
    const formattedPrice = fmtMoney(p, lang, currency);
    switch (c.pay) {
      case "deposit":
        return el("span", "chip deposit", p ? formattedPrice + (c.status === "backlog" ? " · " + ui.pay_deposit_estimate : " · " + ui.pay_deposit) : ui.pay_deposit);
      case "paid":
        return el("span", "chip paid", p ? formattedPrice + " · " + ui.pay_paid : ui.pay_paid);
      case "bonus":
        return el("span", "chip free", ui.pay_free + " · " + ui.pay_bonus);
      case "rework":
        return el("span", "chip free", ui.pay_free + " · " + ui.pay_rework);
      case "separate":
        return el("span", "chip estimate", ui.pay_separate);
      default:
        return el("span", "chip estimate", ui.pay_estimate);
    }
  }

  function getActiveLang(availableLangs, fallbackLang) {
    const p = new URLSearchParams(window.location.search);
    const urlLang = p.get("lang");
    if (urlLang && availableLangs.includes(urlLang)) return urlLang;
    try {
      const stored = localStorage.getItem("lh-board-lang");
      if (stored && availableLangs.includes(stored)) return stored;
    } catch (e) {}
    return fallbackLang || "en";
  }

  function updateUrlLang(lang) {
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("lang", lang);
      window.history.replaceState({}, "", url.toString());
    } catch (e) {}
  }

  function renderLangSwitch(langs, currentLang) {
    const container = $("lang-switch");
    container.replaceChildren(...langs.map(l => {
      const btn = el("button", "lang-btn" + (l === currentLang ? " active" : ""), l.toUpperCase());
      btn.type = "button";
      btn.addEventListener("click", () => {
        if (l !== currentLang) {
          try { localStorage.setItem("lh-board-lang", l); } catch (e) {}
          updateUrlLang(l);
          loadData(l);
        }
      });
      return btn;
    }));
  }

  const pendingDone = new Set();
  const editingCommentCards = new Set();
  const commentDrafts = new Map();

  function saveClientDone(c, nextDone, commentText, fromEdit = false) {
    if (!c.id || pendingDone.has(c.id)) return;
    const prevDoneAt = c.clientDoneAt;
    const prevComment = c.clientDoneComment;

    if (nextDone) {
      if (!c.clientDoneAt) {
        c.clientDoneAt = Math.floor(Date.now() / 1000);
      }
      c.clientDoneComment = commentText || null;
    } else {
      c.clientDoneAt = null;
      c.clientDoneComment = null;
      editingCommentCards.delete(c.id);
      commentDrafts.delete(c.id);
    }
    pendingDone.add(c.id);
    render(lastData, lastLang);

    const bodyObj = { done: nextDone };
    if (nextDone && commentText !== undefined) {
      bodyObj.comment = commentText;
    }

    fetch(`tasks/${encodeURIComponent(c.id)}/done`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(bodyObj),
    })
      .then(r => {
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(res => {
        c.clientDoneAt = res.clientDoneAt;
        c.clientDoneComment = res.clientDoneComment;
        editingCommentCards.delete(c.id);
        commentDrafts.delete(c.id);
      })
      .catch(() => {
        c.clientDoneAt = prevDoneAt;
        c.clientDoneComment = prevComment;
        if (fromEdit) {
          editingCommentCards.add(c.id);
        }
      })
      .finally(() => {
        pendingDone.delete(c.id);
        render(lastData, lastLang);
      });
  }

  function renderClientDoneWidget(c, ui, lang) {
    if (!c.id) return null;
    const isPending = pendingDone.has(c.id);
    const box = el("div", "client-done-box");

    if (c.clientDoneAt) {
      const d = new Date(c.clientDoneAt * 1000);
      const loc = lang === "uk" ? "uk-UA" : (lang === "pl" ? "pl-PL" : (lang === "ru" ? "ru-RU" : "en-US"));
      const timeStr = d.toLocaleString(loc, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
      const markedText = (ui.client_done_marked || "✓ Ви позначили: зроблено") + " · " + timeStr;

      const stat = el("div", "client-done-status");
      stat.setAttribute("aria-pressed", "true");
      stat.append(el("span", null, markedText));
      box.append(stat);

      const isEditing = editingCommentCards.has(c.id);

      if (isEditing) {
        const textarea = el("textarea", "client-done-textarea");
        textarea.rows = 2;
        textarea.maxLength = 500;
        textarea.placeholder = ui.client_done_comment_placeholder || "Коментар для нас (необов'язково)";
        textarea.disabled = isPending;
        const currentVal = commentDrafts.has(c.id) ? commentDrafts.get(c.id) : (c.clientDoneComment || "");
        textarea.value = currentVal;
        textarea.addEventListener("input", (e) => {
          commentDrafts.set(c.id, e.target.value);
        });
        box.append(textarea);

        const actions = el("div", "client-done-actions");

        const saveBtn = el("button", "client-done-save-btn", ui.client_done_comment_save || "Зберегти");
        saveBtn.type = "button";
        saveBtn.disabled = isPending;
        saveBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const draft = commentDrafts.has(c.id) ? commentDrafts.get(c.id) : textarea.value;
          saveClientDone(c, true, draft.trim(), true);
        });
        actions.append(saveBtn);

        const cancelEditBtn = el("button", "client-done-comment-cancel", ui.client_done_comment_cancel || "Відміна");
        cancelEditBtn.type = "button";
        cancelEditBtn.disabled = isPending;
        cancelEditBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          commentDrafts.delete(c.id);
          editingCommentCards.delete(c.id);
          render(lastData, lastLang);
        });
        actions.append(cancelEditBtn);

        const undoBtn = el("button", "client-done-cancel", ui.client_done_cancel || "Скасувати позначку");
        undoBtn.type = "button";
        undoBtn.disabled = isPending;
        undoBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          saveClientDone(c, false);
        });
        actions.append(undoBtn);

        box.append(actions);
      } else {
        if (c.clientDoneComment && c.clientDoneComment.trim()) {
          const commentDiv = el("div", "client-done-comment");
          commentDiv.textContent = `“${c.clientDoneComment}”`;
          box.append(commentDiv);
        }

        const actions = el("div", "client-done-actions");

        const hasComment = Boolean(c.clientDoneComment && c.clientDoneComment.trim());
        const editLinkText = hasComment
          ? (ui.client_done_comment_edit || "Змінити коментар")
          : (ui.client_done_comment_add || "Додати коментар");
        const editLink = el("button", "client-done-link", editLinkText);
        editLink.type = "button";
        editLink.disabled = isPending;
        editLink.addEventListener("click", (e) => {
          e.stopPropagation();
          commentDrafts.set(c.id, c.clientDoneComment || "");
          editingCommentCards.add(c.id);
          render(lastData, lastLang);
        });
        actions.append(editLink);

        const undoBtn = el("button", "client-done-cancel", ui.client_done_cancel || "Скасувати позначку");
        undoBtn.type = "button";
        undoBtn.disabled = isPending;
        undoBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          saveClientDone(c, false);
        });
        actions.append(undoBtn);

        box.append(actions);
      }
    } else {
      const textarea = el("textarea", "client-done-textarea");
      textarea.rows = 2;
      textarea.maxLength = 500;
      textarea.placeholder = ui.client_done_comment_placeholder || "Коментар для нас (необов'язково)";
      textarea.disabled = isPending;
      if (commentDrafts.has(c.id)) {
        textarea.value = commentDrafts.get(c.id);
      }
      textarea.addEventListener("input", (e) => {
        commentDrafts.set(c.id, e.target.value);
      });
      box.append(textarea);

      const btn = el("button", "btn-client-done", ui.client_done_action || "Позначити як зроблене");
      btn.type = "button";
      btn.setAttribute("aria-pressed", "false");
      btn.disabled = isPending;
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const draft = commentDrafts.has(c.id) ? commentDrafts.get(c.id) : textarea.value;
        saveClientDone(c, true, draft.trim(), false);
      });
      box.append(btn);

      const hint = el("div", "client-done-hint", ui.client_done_hint || "Зробили свою частину? Натисніть — ми побачимо позначку. За потреби додайте коментар.");
      box.append(hint);
    }
    return box;
  }

  function render(data, lang) {
    lastData = data;
    lastLang = lang;
    const ui = data.ui;
    const currency = data.currency;

    document.documentElement.lang = lang;
    document.title = [data.title, ui.page_title].filter(Boolean).join(" — ");
    $("brand").textContent = data.title || "";
    $("board-title").textContent = ui.page_title || "";

    $("lbl-paid").textContent = ui.ledger_paid;
    $("lbl-dep").textContent = ui.ledger_deposit;
    $("lbl-used").textContent = ui.ledger_allocated;
    $("lbl-rest").textContent = ui.ledger_remaining;

    $("lg-paid").textContent = fmtMoney(data.ledger.paid, lang, currency);
    $("lg-dep").textContent = fmtMoney(data.ledger.deposit, lang, currency);
    $("lg-used").textContent = fmtMoney(data.ledger.allocated, lang, currency);
    $("lg-rest").textContent = fmtMoney(data.ledger.remaining, lang, currency);

    if (data.updatedAt) {
      const d = new Date(data.updatedAt);
      const loc = lang === "uk" ? "uk-UA" : (lang === "pl" ? "pl-PL" : (lang === "ru" ? "ru-RU" : "en-US"));
      $("updated").textContent = (ui.updated_at_prefix || "") + d.toLocaleString(loc, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
      $("updated").className = "sub";
    }

    if (data.status && data.status.trim()) {
      $("status-card").hidden = false;
      $("lbl-status").textContent = ui.status_title || "Де ми зараз";
      $("status-text").textContent = data.status.trim();
      if (data.statusUpdatedAt) {
        const d = new Date(data.statusUpdatedAt * 1000);
        const loc = lang === "uk" ? "uk-UA" : (lang === "pl" ? "pl-PL" : (lang === "ru" ? "ru-RU" : "en-US"));
        $("status-time").textContent = (ui.status_updated_prefix || "оновлено ") + d.toLocaleString(loc, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
      } else {
        $("status-time").textContent = "";
      }
    } else {
      $("status-card").hidden = true;
    }

    const cards = data.cards || data.tasks || [];
    const waitingCards = cards.filter(c => c.status === "waiting");
    if (waitingCards.length > 0) {
      $("waiting-banner").hidden = false;
      $("waiting-banner-title").textContent = (ui.waiting_banner_title || "Потрібно від вас") + " (" + waitingCards.length + ")";
      $("waiting-banner-list").replaceChildren(...waitingCards.map(c => {
        const card = el("div", "waiting-card");
        card.append(el("div", "w-title", c.title));
        if (c.note) card.append(el("div", "w-note", c.note));
        const w = renderClientDoneWidget(c, ui, lang);
        if (w) card.append(w);
        return card;
      }));
    } else {
      $("waiting-banner").hidden = true;
      $("waiting-banner-list").replaceChildren();
    }

    $("info-title").textContent = ui.info_title;
    $("info-backlog").textContent = ui.info_backlog;
    $("info-waiting").textContent = ui.info_waiting;

    $("footer-q-title").textContent = ui.footer_question_title;
    $("footer-q-text").textContent = ui.footer_question_text;
    $("footer-notice").textContent = ui.footer_private_notice;

    renderLangSwitch(data.langs, lang);

    $("board").replaceChildren(...COLS.map(col => {
      const colName = ui[col.titleKey] || col.id;
      const colHint = ui[col.hintKey] || "";
      const list = cards.filter(c => c.status === col.id).sort((a, b) => a.position - b.position);

      const sec = el("details", "col " + col.id);
      sec.setAttribute("aria-label", colName);
      sec.open = isOpen(col.id, list.length);

      const sum = el("summary");
      const h = el("h2");
      const name = el("span", "name");
      name.append(el("span", "chev", "›"), el("span", null, colName));
      h.append(name);

      const total = list.filter(c => c.pay === "deposit" || c.pay === "paid").reduce((s, c) => s + (Number(c.price) || 0), 0);
      h.append(el("span", "meta", list.length + (total ? " · " + fmtMoney(total, lang, currency) : "")));
      sum.append(h);

      sum.addEventListener("click", (e) => { if (!mobile.matches) e.preventDefault(); });
      sec.addEventListener("toggle", () => { if (mobile.matches) remember(col.id, sec.open); });
      sec.append(sum);

      const body = el("div", "body");
      if (colHint) body.append(el("p", "hint", colHint));
      if (!list.length) body.append(el("div", "empty", ui.empty_column));
      list.forEach(c => {
        const card = el("article", "card");
        const titleDiv = el("div", "title");
        titleDiv.append(el("span", null, c.title));
        const isNew = prevVisit && c.updatedAt && (c.updatedAt > prevVisit);
        if (isNew) {
          titleDiv.append(el("span", "badge-new", ui.badge_new || "нове"));
        }
        card.append(titleDiv);
        const row = el("div", "row");
        row.append(priceChip(c, ui, lang, currency));
        card.append(row);
        if (c.note) card.append(el("div", "note", c.note));
        body.append(card);
      });
      sec.append(body);
      return sec;
    }));

    const archiveList = data.archive || [];
    if (archiveList.length > 0) {
      $("archive-section").hidden = false;
      $("lbl-archive-title").textContent = ui.archive_title || "Архів";
      $("archive-months").replaceChildren(...archiveList.map(m => {
        const sec = el("details", "archive-month");
        const sum = el("summary");
        const chev = el("span", "chev", "›");
        const monthName = fmtMonth(m.month, lang);
        const countAndSum = m.count + (m.sum > 0 ? " · " + fmtMoney(m.sum, lang, currency) : "");
        const titleSpan = el("span", "archive-month-title", monthName + " · " + countAndSum);
        sum.append(chev, titleSpan);
        sec.append(sum);

        const itemsBox = el("div", "archive-items");
        (m.items || []).forEach(it => {
          const itRow = el("div", "archive-item");
          itRow.append(el("span", "a-title", it.title));
          itRow.append(priceChip(it, ui, lang, currency));
          itemsBox.append(itRow);
        });
        sec.append(itemsBox);
        return sec;
      }));
    } else {
      $("archive-section").hidden = true;
      $("archive-months").replaceChildren();
    }
  }

  function loadData(lang) {
    const url = "data.json" + (lang ? "?lang=" + encodeURIComponent(lang) : "");
    fetch(url, { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        const resolvedLang = lang || getActiveLang(data.langs, data.clientLang);
        if (!lang) {
          updateUrlLang(resolvedLang);
          if (resolvedLang !== data.clientLang) {
            loadData(resolvedLang);
            return;
          }
        }
        render(data, resolvedLang);
      })
      .catch(() => {
        const errText = (lastData && lastData.ui && lastData.ui.error_load) || "Failed to load board. Please refresh the page in a moment.";
        $("updated").textContent = errText;
        $("updated").className = "sub err";
      });
  }

  const p = new URLSearchParams(window.location.search);
  const initialLang = p.get("lang");
  loadData(initialLang);
})();
</script>
</body>
</html>

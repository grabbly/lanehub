<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- LaneHub Autopilot app icon (concept "C · Bot"): 824px squircle on a 1024 canvas, per macOS icon grid. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1550"/><stop offset="1" stop-color="#0c0717"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff4fd6"/><stop offset="1" stop-color="#36e3ff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4b2a8a"/><stop offset="1" stop-color="#1b1036"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#ff4fd6" stop-opacity=".35"/><stop offset="1" stop-color="#ff4fd6" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
    <rect x="106" y="106" width="812" height="812" rx="180" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="6"/>
  </g>
  <g transform="translate(100 100) scale(6.4375)">
    <!-- glow layer under crisp shapes -->
    <g filter="url(#blur)" opacity=".75">
      <rect x="28" y="40" width="72" height="58" rx="18" fill="none" stroke="url(#edge)" stroke-width="5"/>
      <circle cx="50" cy="69" r="9" fill="#36e3ff"/><circle cx="78" cy="69" r="9" fill="#36e3ff"/>
      <circle cx="64" cy="22" r="7" fill="#ff4fd6"/>
    </g>
    <rect x="28" y="40" width="72" height="58" rx="18" fill="url(#head)" stroke="url(#edge)" stroke-width="4"/>
    <circle cx="50" cy="69" r="8" fill="#36e3ff"/>
    <circle cx="78" cy="69" r="8" fill="#36e3ff"/>
    <path d="M64 40V26" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="64" cy="22" r="6" fill="#ff4fd6"/>
  </g>
</svg>
